<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>METRA CLOUD - Elite Sales v3.0</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f9;margin:0;padding:20px}
.wrap{display:grid;grid-template-columns:360px 1fr;gap:20px;max-width:1200px;margin:auto}
.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
input[type=text],input[type=number]{width:100%;padding:8px;margin:4px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{width:100%;padding:14px;border:0;background:#1d4ed8;color:#fff;border-radius:8px;font-weight:bold;cursor:pointer}
#preview{white-space:pre-wrap;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h2>METRA CLOUD<br><small>Elite Sales v3.0</small></h2>

<label>Usuários</label>
<input type="number" id="usuarios" value="1" min="1">

<label>Validade</label>
<input type="text" id="validade" value="30/06/2026">

<p><input type="checkbox" id="premium"> Exibir Plano Premium</p>
<p><input type="checkbox" id="canal"> Exibir Canal de Denúncia</p>

<hr>

<h3>Implantação</h3>
<div class="grid">
<input id="implDe" value="990,00">
<input id="implPara" value="480,00">
</div>

<h3>Essencial</h3>
<div class="grid">
<input id="essBase" value="250,00">
<input id="essAdd" value="75,00">
</div>

<h3>Profissional</h3>
<div class="grid">
<input id="proBase" value="320,00">
<input id="proAdd" value="100,00">
</div>

<h3>Premium</h3>
<div class="grid">
<input id="preBase" value="520,00">
<input id="preAdd" value="125,00">
</div>

<button onclick="copiar()">COPIAR PROPOSTA</button>
</div>

<div class="card">
<h3>Pré-visualização</h3>
<div id="preview"></div>
</div>
</div>

<script>
function f(v){return parseFloat(v.replace(/\./g,'').replace(',','.'))}
function br(v){return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
document.querySelectorAll("input").forEach(x=>x.oninput=atualizar);

function atualizar(){
let u=parseInt(usuarios.value)||1;
let a=u-1;
let e=f(essBase.value)+a*f(essAdd.value);
let p=f(proBase.value)+a*f(proAdd.value);
let pr=f(preBase.value)+a*f(preAdd.value);

let t="";
t+="📄 *Proposta – METRA CLOUD* ("+String(u).padStart(2,"0")+" usuário"+(u>1?"s":"")+")\n\n";
t+="💰 *Licença de uso + capacitação*\n";
t+="De R$ "+implDe.value+" ➝ *"+br(f(implPara.value))+"*\n";
t+="ou *10x de "+br(f(implPara.value)/10)+"*\n\n";
t+="💳 *Mensalidade*\n\n";
t+="🔹 *Plano Essencial*\n";
t+="Sem Financeiro, Faturamento, IA, Boleto e Nota Fiscal\n";
t+="*"+br(e)+" / mês*\n\n";
t+="⭐ *Plano Profissional*\n";
t+="Com Financeiro, Faturamento e IA\n";
t+="*"+br(p)+" / mês*\n\n";
if(premium.checked){
t+="💎 *Plano Premium*\n";
t+="Com Financeiro, Faturamento, IA, Boleto e Nota Fiscal\n";
t+="*"+br(pr)+" / mês*\n\n";
}
if(canal.checked){
t+="➕ *Canal de Denúncia*\n";
t+="*R$ 49,90 / mês por empresa*\n\n";
}
t+="🔓 Liberação em *1 dia útil*\n\n";
t+="🗓 *Proposta válida até "+validade.value+"*";
preview.textContent=t;
}
function copiar(){
navigator.clipboard.writeText(preview.textContent);
alert("Proposta copiada!");
}
atualizar();
</script>
</body>
</html>

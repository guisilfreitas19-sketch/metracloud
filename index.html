<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Metra Cloud - Elite Sales v2.4.0</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1d4ed8;
      --primary-dark: #1e40af;
      --primary-light: #dbeafe;
      --bg-main: #f1f5f9;
      --bg-card: #ffffff;
      --border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --wa-bg: #f8fafc;
      --wa-bubble: #ffffff;
    }

    * { box-sizing: border-box; font-family: 'Inter', sans-serif; transition: all 0.15s ease; }
    body { background-color: var(--bg-main); color: var(--text-main); margin: 0; padding: 40px 20px; display: flex; justify-content: center; min-height: 100vh; }
    .container { width: 100%; max-width: 1000px; display: grid; grid-template-columns: 380px 1fr; gap: 32px; }
    .card { background: var(--bg-card); border-radius: 20px; padding: 32px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); border: 1px solid var(--border); height: fit-content; position: sticky; top: 20px; }
    .logo-header { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
    .logo-sq { background: var(--primary); width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 800; font-size: 24px; }
    h2 { font-size: 22px; margin: 0; color: var(--text-main); font-weight: 700; }
    h2 span { color: var(--primary); }
    label { display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.7px; }
    input { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 15px; outline: none; margin-bottom: 5px; }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(29, 78, 216, 0.1); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 15px; }
    .btn-copy { width: 100%; padding: 18px; background: var(--primary); color: white; border: none; border-radius: 14px; font-weight: 700; font-size: 16px; cursor: pointer; margin-top: 15px; box-shadow: 0 4px 12px rgba(29, 78, 216, 0.3); }
    .btn-copy:hover { background: var(--primary-dark); transform: translateY(-1px); }
    .switch-row { display: flex; align-items: center; justify-content: space-between; padding: 14px; background: var(--wa-bg); border-radius: 12px; border: 1px solid var(--border); margin-bottom: 10px; }
    .switch-row label { margin: 0; text-transform: none; font-size: 13px; font-weight: 600; color: var(--text-main); }
    .config-btn { background: var(--primary-light); border: none; color: var(--primary); font-size: 11px; font-weight: 700; cursor: pointer; width: 100%; padding: 12px; border-radius: 10px; margin-top: 20px; text-transform: uppercase; }
    .config-sec { display: none; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border); animation: fadeIn 0.3s ease; }
    .preview-area { background: var(--wa-bg); border-radius: 20px; padding: 40px; border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; }
    .preview-header { font-size: 11px; color: var(--primary); font-weight: 800; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1.5px; background: #fff; padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border); }
    .wa-bubble { background: var(--wa-bubble); padding: 30px; border-radius: 0 16px 16px 16px; font-size: 15px; line-height: 1.6; color: #111b21; white-space: pre-wrap; box-shadow: 0 4px 15px rgba(0,0,0,0.05); position: relative; align-self: flex-start; max-width: 95%; }
    .wa-bubble::before { content: ""; position: absolute; left: -12px; top: 0; border-style: solid; border-width: 0 12px 12px 0; border-color: transparent var(--wa-bubble) transparent transparent; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; } }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <div class="logo-header">
      <div class="logo-sq">M</div>
      <div><h2>Metra <span>Cloud</span></h2><small style="color:var(--text-muted)">Elite Sales v2.4.0</small></div>
    </div>

    <div class="grid">
      <div><label>👥 Usuários</label><input type="number" id="usuarios" value="1"></div>
      <div><label>🗓 Validade</label><input type="text" id="validade" value="30/04"></div>
    </div>

    <div class="switch-row">
      <label>Exibir Canal de Denúncia</label>
      <input type="checkbox" id="showCanal" checked style="width:20px; height:20px;">
    </div>

    <button class="btn-copy" id="btnCopiar" onclick="copiar()">COPIAR PROPOSTA</button>

    <button class="config-btn" onclick="toggleConfig()">Ajustar Valores Base ▼</button>

    <div id="conf" class="config-sec">
      <label>Implantação (De / Para)</label>
      <div class="grid">
        <input type="text" id="impl_de" value="990,00" oninput="mascaraMoeda(this)">
        <input type="text" id="impl_para" value="480,00" oninput="mascaraMoeda(this)">
      </div>
      <div class="grid">
        <div><label>Essencial Base</label><input type="text" id="op1" value="250,00" oninput="mascaraMoeda(this)"></div>
        <div><label>Essencial Adic</label><input type="text" id="op1_adic" value="75,00" oninput="mascaraMoeda(this)"></div>
      </div>
      <div class="grid">
        <div><label>Profissional Base</label><input type="text" id="op2" value="319,90" oninput="mascaraMoeda(this)"></div>
        <div><label>Profissional Adic</label><input type="text" id="op2_adic" value="100,00" oninput="mascaraMoeda(this)"></div>
      </div>
    </div>
  </div>

  <div class="preview-area">
    <div class="preview-header">Pré-visualização (WhatsApp)</div>
    <div id="preview" class="wa-bubble"></div>
  </div>
</div>

<script>
  function toggleConfig() {
    const section = document.getElementById('conf');
    section.style.display = section.style.display === 'block' ? 'none' : 'block';
  }

  function mascaraMoeda(i) {
    let v = i.value.replace(/\D/g, '');
    v = (v / 100).toFixed(2) + '';
    v = v.replace(".", ",");
    v = v.replace(/(\d)(\d{3})(\d{3}),/g, "$1.$2.$3,");
    v = v.replace(/(\d)(\d{3}),/g, "$1.$2,");
    i.value = v;
    salvarDados();
    atualizar();
  }

  function moneyToFloat(v) {
    if(!v) return 0;
    return parseFloat(v.replace(/\./g, '').replace(',', '.'));
  }

  function format(v) {
    return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  }

  function salvarDados() {
    const config = {
      impl_de: document.getElementById('impl_de').value,
      impl_para: document.getElementById('impl_para').value,
      op1: document.getElementById('op1').value,
      op1_adic: document.getElementById('op1_adic').value,
      op2: document.getElementById('op2').value,
      op2_adic: document.getElementById('op2_adic').value,
      showCanal: document.getElementById('showCanal').checked
    };
    localStorage.setItem('metraConfigV2', JSON.stringify(config));
  }

  function carregarDados() {
    const salvo = localStorage.getItem('metraConfigV2');
    if(salvo) {
      const c = JSON.parse(salvo);
      document.getElementById('impl_de').value = c.impl_de || "990,00";
      document.getElementById('impl_para').value = c.impl_para || "480,00";
      document.getElementById('op1').value = c.op1;
      document.getElementById('op1_adic').value = c.op1_adic;
      document.getElementById('op2').value = c.op2;
      document.getElementById('op2_adic').value = c.op2_adic;
      document.getElementById('showCanal').checked = c.showCanal;
    }
  }

  function atualizar() {
    const n = parseInt(document.getElementById('usuarios').value) || 1;
    const adic = n - 1;
    
    const implDe = document.getElementById('impl_de').value;
    const implPara = moneyToFloat(document.getElementById('impl_para').value);
    
    const op1 = moneyToFloat(document.getElementById('op1').value) + (adic * moneyToFloat(document.getElementById('op1_adic').value));
    const op2 = moneyToFloat(document.getElementById('op2').value) + (adic * moneyToFloat(document.getElementById('op2_adic').value));
    const validade = document.getElementById('validade').value;

    let txt = `📄 *Proposta – METRA CLOUD* (${n.toString().padStart(2, '0')} usuário${n > 1 ? 's' : ''})\n\n`;
    
    txt += `💰 *Licença de uso + capacitação*\n`;
    txt += `De R$ ${implDe} ➝ *${format(implPara)}*\n`;
    txt += `ou *10x de ${format(implPara/10)}*\n\n`;

    txt += `💳 *Mensalidade* (uso do sistema)\n\n`;

    txt += `🔹 *Plano Essencial* – sem Faturamento, Financeiro e IA\n`;
    txt += `*${format(op1)} / mês*\n\n`;

    txt += `⭐ *Plano Profissional* – com Faturamento, Financeiro e IA *(mais completo)*\n`;
    txt += `*${format(op2)} / mês*\n\n`;

    if(document.getElementById('showCanal').checked) {
      txt += `➕ *Canal de Denúncia*\n`;
      txt += `*R$ 49,90 / mês por empresa*\n`;
      txt += `💡 Pode ser ofertado para sua base, gerando *receita recorrente*\n\n`;
    }

    txt += `🔓 Liberação em *1 dia útil*\n`;
    txt += `🗓 Condição válida até *${validade}*`;

    document.getElementById('preview').textContent = txt;
  }

  function copiar() {
    const text = document.getElementById('preview').textContent;
    const btn = document.getElementById('btnCopiar');
    navigator.clipboard.writeText(text).then(() => {
      btn.textContent = "✅ COPIADO!";
      btn.style.background = "#10b981";
      setTimeout(() => { 
        btn.textContent = "COPIAR PROPOSTA"; 
        btn.style.background = ""; 
      }, 2000);
    });
  }

  document.querySelectorAll('input').forEach(el => {
    el.addEventListener('input', () => {
      if(el.type === 'checkbox') salvarDados();
      atualizar();
    });
  });

  window.onload = () => { carregarDados(); atualizar(); };
</script>

</body>
</html>
